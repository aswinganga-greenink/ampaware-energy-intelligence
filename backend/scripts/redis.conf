# =============================================================================
# Redis configuration for AmpAware development
# =============================================================================

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence: AOF (Append Only File) — survives restarts
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no

# RDB snapshot as backup
save 900 1
save 300 10
save 60 10000

# Memory policy: evict least-recently-used keys when maxmemory is reached
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Slow log: record queries taking > 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable dangerous commands in production (uncomment)
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command DEBUG ""
